<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Apple icon grid: 824x824 rounded rect (r≈185) centered in a 1024 canvas with
         transparent margins, so Dock corners match every other macOS icon. -->
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <radialGradient id="aurora1" cx="18%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#35d4c3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#35d4c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="42%">
      <stop offset="55%" stop-color="#35d4c3" stop-opacity="0"/>
      <stop offset="85%" stop-color="#35d4c3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#35d4c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee08a"/>
      <stop offset="100%" stop-color="#4bc270"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#squircle)">
    <g transform="translate(100,100) scale(0.8046875)">
    <rect width="1024" height="1024" fill="#0a0c14"/>
    <rect width="1024" height="1024" fill="url(#aurora1)"/>
    <rect width="1024" height="1024" fill="url(#aurora2)"/>
    <rect width="1024" height="1024" fill="url(#aurora3)"/>
    <circle cx="512" cy="560" r="400" fill="url(#glow)"/>

    <ellipse cx="512" cy="866" rx="220" ry="42" fill="rgba(0,0,0,0.35)"/>

    <!-- antenna -->
    <line x1="512" y1="330" x2="512" y2="220" stroke="#2f8f52" stroke-width="26" stroke-linecap="round"/>
    <circle cx="512" cy="196" r="44" fill="url(#body)" stroke="#2f8f52" stroke-width="18"/>

    <!-- blob body -->
    <path d="M512 300 C672 300 780 408 780 552 C780 714 672 806 512 806 C352 806 244 714 244 552 C244 408 352 300 512 300 Z"
      fill="url(#body)" stroke="#2f8f52" stroke-width="22"/>
    <ellipse cx="512" cy="644" rx="150" ry="105" fill="#a8ecb1" opacity="0.85"/>

    <!-- arms -->
    <circle cx="278" cy="608" r="52" fill="url(#body)" stroke="#2f8f52" stroke-width="18"/>
    <circle cx="746" cy="608" r="52" fill="url(#body)" stroke="#2f8f52" stroke-width="18"/>

    <!-- face -->
    <circle cx="440" cy="540" r="40" fill="#123320"/>
    <circle cx="584" cy="540" r="40" fill="#123320"/>
    <circle cx="453" cy="527" r="13" fill="#ffffff"/>
    <circle cx="597" cy="527" r="13" fill="#ffffff"/>
    <path d="M458 630 Q512 682 566 630" stroke="#123320" stroke-width="22" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
